<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshade — The Gilded Vault III</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #0a0c18; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="1280" height="720" aria-label="Nightshade, a top-down stealth game: slip past the guards, steal the relics, reach the exit unseen"></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
